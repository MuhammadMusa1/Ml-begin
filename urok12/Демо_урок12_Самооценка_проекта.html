<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Демо · Самооценка проекта</title>
<style>
  :root{--bg:#17132E;--card:#241E42;--card2:#2C2552;--violet:#8B7DF5;--violetd:#5B4FC4;
    --cyan:#27D3EE;--teal:#2DD4BF;--lav:#D9D4F2;--muted:#9E96C8;--warn:#FF7A8A;--green:#6EE7B7;--white:#fff;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--lav);font-family:"Segoe UI",Calibri,system-ui,sans-serif;padding:24px;line-height:1.5}
  .wrap{max-width:820px;margin:0 auto}
  h1{color:var(--white);font-size:27px;margin:0 0 4px}
  .kick{color:var(--cyan);font-weight:700;letter-spacing:2px;font-size:13px;text-transform:uppercase}
  .sub{color:var(--muted);margin:6px 0 20px}
  .crit{background:var(--card);border-radius:14px;padding:16px 18px;margin-bottom:12px}
  .crit .top{display:flex;justify-content:space-between;align-items:center}
  .crit .name{font-weight:700;color:var(--white);font-size:16px}
  .crit .max{font-size:12px;color:var(--muted)}
  .crit .desc{font-size:13px;color:var(--muted);margin:4px 0 10px}
  .opts{display:flex;gap:8px;flex-wrap:wrap}
  .opt{flex:1;min-width:90px;background:var(--card2);border:2px solid transparent;border-radius:10px;
    padding:9px;text-align:center;cursor:pointer;font-size:13px;transition:.15s}
  .opt:hover{border-color:var(--violetd)}
  .opt.sel{border-color:var(--cyan);background:#0E3540;color:var(--white)}
  .opt b{display:block;font-size:18px;color:var(--cyan)}
  .result{position:sticky;bottom:0;background:var(--card2);border-radius:16px;padding:18px;margin-top:16px;
    display:flex;align-items:center;gap:20px;box-shadow:0 -4px 20px rgba(0,0,0,.3)}
  .score{font-size:44px;font-weight:800;color:var(--teal);min-width:110px;text-align:center}
  .score small{font-size:18px;color:var(--muted)}
  .grade{font-size:20px;font-weight:700}
  .tip{font-size:14px;color:var(--lav);margin-top:4px}
  .progress{height:12px;background:#0E0B22;border-radius:6px;overflow:hidden;margin-top:8px}
  .progress>div{height:100%;background:linear-gradient(90deg,var(--violetd),var(--cyan));width:0;transition:.3s}
</style>
</head>
<body>
<div class="wrap">
  <div class="kick">Урок 12 · инструмент самооценки</div>
  <h1>🎯 Оцени свой проект по рубрике</h1>
  <p class="sub">Отметь честно, что уже сделано в проекте. Балл считается автоматически. Цель — понять, что улучшить перед защитой.</p>

  <div id="crits"></div>

  <div class="result">
    <div class="score"><span id="total">0</span><small>/10</small></div>
    <div style="flex:1">
      <div class="grade" id="grade">—</div>
      <div class="tip" id="tip">Отметь пункты выше.</div>
      <div class="progress"><div id="pbar"></div></div>
    </div>
  </div>
</div>

<script>
const criteria=[
  {name:"Постановка задачи", max:2, desc:"Понятно, что предсказываем и какие признаки",
   levels:[["0","нет"],["1","есть, но размыто"],["2","чётко"]]},
  {name:"Использование ML", max:3, desc:"Модель в Pipeline + сравнение с baseline",
   levels:[["0","нет модели"],["1","модель без Pipeline"],["2","Pipeline, нет baseline"],["3","Pipeline + baseline"]]},
  {name:"Визуализация", max:2, desc:"График(и) помогают понять данные/результат",
   levels:[["0","нет"],["1","есть базовый"],["2","понятный и уместный"]]},
  {name:"Интерпретация", max:3, desc:"Правильная метрика под задачу + вывод словами",
   levels:[["0","нет"],["1","только accuracy"],["2","метрика есть, вывод слабый"],["3","метрика + ясный вывод"]]},
];
const scores=criteria.map(()=>0);
const box=document.getElementById('crits');
criteria.forEach((c,ci)=>{
  const el=document.createElement('div');el.className='crit';
  el.innerHTML=`<div class="top"><span class="name">${c.name}</span><span class="max">макс. ${c.max}</span></div>
    <div class="desc">${c.desc}</div><div class="opts"></div>`;
  const opts=el.querySelector('.opts');
  c.levels.forEach(([val,lbl])=>{
    const o=document.createElement('div');o.className='opt';
    o.innerHTML=`<b>${val}</b>${lbl}`;
    o.addEventListener('click',()=>{
      opts.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      o.classList.add('sel'); scores[ci]=+val; update();
    });
    opts.appendChild(o);
  });
  box.appendChild(el);
});
function update(){
  const total=scores.reduce((a,b)=>a+b,0);
  document.getElementById('total').textContent=total;
  document.getElementById('pbar').style.width=(total/10*100)+'%';
  let grade,tip,col;
  if(total>=9){grade='Отлично 🎉';col='#6EE7B7';tip='Проект готов к защите. Отрепетируй речь на 2–3 минуты.';}
  else if(total>=7){grade='Хорошо';col='#27D3EE';tip='Крепкий проект. Усиль самый слабый критерий.';}
  else if(total>=5){grade='Зачёт';col='#8B7DF5';tip='Основа есть. Добавь baseline и вывод словами.';}
  else if(total>0){grade='Нужно доработать';col='#FF7A8A';tip='Проверь: есть ли Pipeline, baseline и честная метрика?';}
  else {grade='—';col='#9E96C8';tip='Отметь пункты выше.';}
  const g=document.getElementById('grade');g.textContent=grade;g.style.color=col;
  document.getElementById('tip').textContent=tip;
}
update();
</script>
</body>
</html>
